<html lang="mn">
<head>
<meta charset="utf-8">
<title>Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#111114;--card:#18181c;--line:#26262c;--tx:#ececf0;--mut:#8b8b96;--ac:#ff8a1f;--ok:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-weight:800;color:var(--ac);padding:6px 12px 14px;font-size:18px}
.gt{font-family:'Exo 2',Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;width:100%;background:none;border:0;color:var(--tx);font-weight:700;font-size:13px;padding:10px 12px;cursor:pointer}
.it{font-family:'Exo 2',Inter,system-ui,sans-serif;font-weight:600;letter-spacing:.02em;display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:8px;color:var(--mut);padding:9px 12px;font-size:14px;cursor:pointer;text-align:left}
.it:hover{background:#1a1a1f;color:var(--tx)}.it.on{background:rgba(255,138,31,.12);color:var(--ac);font-weight:600}
.dcb{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 20px;padding:24px 28px;border-radius:18px;background:linear-gradient(110deg,#4752e8,#6f7dff);color:#fff;text-decoration:none}
.dcb:hover{filter:brightness(1.08)}.dcb b{display:block;font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}.dcb span{font-size:13px;opacity:.9}
.dcb i{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
